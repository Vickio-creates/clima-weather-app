<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef3ff">
    <title>Welcome to Clima</title>

    <link rel="stylesheet" href="../style/output.css">
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="../scripts/onboarding.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet" />

</head>

<body>
    <main
        class="relative isolate flex min-h-screen items-center justify-center overflow-hidden bg-[#eef3ff] px-4 py-8 font-[Inter] text-[#202938] max-md:items-start max-md:px-[18px] max-md:pt-[100px] max-md:pb-7 [@media(max-height:720px)_and_(min-width:761px)]:items-start [@media(max-height:720px)_and_(min-width:761px)]:pt-[95px]">
        <i data-lucide="cloud"
            class="absolute left-[10.5%] top-[16.8%] -z-10 hidden size-10 text-[#c9dcff] opacity-70 md:block"
            aria-hidden="true">
        </i>

        <svg class="absolute right-[10.5%] top-[13.8%] -z-10 hidden size-24 rounded-full border border-white/70 p-6 text-[#c9dcff] opacity-90 md:block"
            viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <circle cx="32" cy="32" r="10" />
            <path d="M32 8v7m0 34v7M8 32h7m34 0h7M15 15l5 5m24 24 5 5m0-34-5 5M20 44l-5 5" />
        </svg>
        <svg class="absolute bottom-[13.3%] left-[6.3%] -z-10 hidden size-24 rounded-full border border-white/70 p-6 text-[#c9dcff] opacity-90 md:block"
            viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M17 39h30a9 9 0 0 0 1-18 15 15 0 0 0-28-3 11 11 0 0 0-3 21Z" />
            <path d="M23 45v9m9-9v13m9-13v9" />
        </svg>
        <svg class="absolute right-[3.6%] bottom-[13.3%] -z-10 hidden size-24 rounded-full border border-white/70 p-6 text-[#c9dcff] opacity-90 md:block"
            viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M35 7 14 34h15l-3 23 24-31H34l1-19Z" />
        </svg>

        <ol class="absolute left-1/2 top-[clamp(30px,calc(50vh_-_379px),133px)] flex -translate-x-1/2 list-none items-center gap-3 p-0 max-md:top-6 [@media(max-height:720px)_and_(min-width:761px)]:top-[25px]"
            aria-label="Onboarding progress">
            <li aria-current="step"><span
                    class="grid size-8 place-items-center rounded-full border border-[#2d6cdf] bg-[#2d6cdf] text-sm font-bold leading-none text-white">1</span>
            </li>
            <li><span
                    class="grid size-8 place-items-center rounded-full border border-slate-300 bg-white/80 text-sm font-semibold leading-none text-slate-600">2</span>
            </li>
            <li><span
                    class="grid size-8 place-items-center rounded-full border border-slate-300 bg-white/80 text-sm font-semibold leading-none text-slate-600">3</span>
            </li>
            <li><span
                    class="grid size-8 place-items-center rounded-full border border-slate-300 bg-white/80 text-sm font-semibold leading-none text-slate-600">4</span>
            </li>
            <li><span
                    class="grid size-8 place-items-center rounded-full border border-slate-300 bg-white/80 text-sm font-semibold leading-none text-slate-600">5</span>
            </li>
        </ol>

        <section
            class="flex h-[580px] w-full max-w-[650px] shrink-0 -translate-y-[5px] flex-col items-center rounded-[32px] border border-white/75 bg-white/[0.78] text-center shadow-[0_28px_64px_rgba(51,75,112,0.09)] max-md:h-auto max-md:min-h-0 max-md:translate-y-0 max-md:rounded-[26px] max-md:px-[22px] max-md:pb-[25px]"
            aria-labelledby="welcome-title">
            <div class="flex h-[180px] w-full shrink-0 items-center justify-center max-md:h-[145px]"
                role="img" aria-label="Clima logo">
                <div class="flex translate-y-10 items-center gap-4 max-md:translate-y-6">
                    <span
                        class="grid size-[76px] shrink-0 place-items-center rounded-2xl bg-[#2d6cdf] text-white shadow-[0_8px_20px_rgba(45,108,223,0.25)]">
                        <i data-lucide="cloud" class="size-10" aria-hidden="true"></i>
                    </span>
                    <span class="text-[42px] font-bold tracking-[-0.055em] text-[#202938]">
                        Clima
                    </span>

                </div>
            </div>
            <h1 id="welcome-title"
                class="mt-[18px] text-[50px] leading-[58px] font-bold tracking-[-0.045em] text-[#202938] max-md:mt-4 max-md:text-[clamp(34px,9vw,46px)] max-md:leading-[1.13]">
                Welcome to Clima</h1>
            <h2
                class="mt-[9px] text-[27px] leading-9 font-medium tracking-[-0.018em] text-[#505b6c] max-md:mt-2 max-md:text-[clamp(20px,5.3vw,25px)] max-md:leading-[1.35]">
                Your Personal Weather Assistant</h2>
            <p
                class="mt-[18px] max-w-[510px] text-[16px] leading-[27px] font-normal tracking-[0.005em] text-[#707b8d] max-md:mt-[17px] max-md:text-[15px] max-md:leading-[1.65]">
                Let's personalize your experience and help you make smarter<br class="max-md:hidden"> weather decisions
                every day.</p>
            <p class="mt-[17px] text-[18px] leading-6 font-semibold text-[#2d6cdf] max-md:mt-[14px] max-md:text-[16px]">
                Smart forecasts. Smarter decisions.</p>
            <a class="mt-6 grid h-[60px] w-[280px] max-w-full shrink-0 place-items-center rounded-2xl bg-[#2d6cdf] text-[17px] font-bold text-white shadow-[0_12px_22px_rgba(45,108,223,0.24)] transition duration-150 hover:-translate-y-px hover:bg-[#2563d5] hover:shadow-[0_15px_26px_rgba(45,108,223,0.29)] focus-visible:outline-3 focus-visible:outline-offset-4 focus-visible:outline-[#2d6cdf]/40 motion-reduce:transition-none max-md:mt-6 max-md:w-full"
                href="activity.html">Get Started</a>
        </section>
    </main>
</body>

</html>
