<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef3ff">

    <title>Weather Sensitivity | Clima</title>

    <link rel="stylesheet" href="../style/output.css">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../scripts/onboarding.js" defer></script>
</head>

<body>
    <main class="relative flex min-h-screen items-center justify-center overflow-hidden bg-[#eef3ff] px-4 py-8">

        <!-- Background decorations -->
        <div class="pointer-events-none absolute -left-20 top-20 size-64 rounded-full bg-blue-200/30 blur-3xl"></div>
        <div class="pointer-events-none absolute -right-20 bottom-10 size-72 rounded-full bg-purple-200/30 blur-3xl"></div>

        <!-- Onboarding card -->
        <section class="relative flex min-h-[650px] w-full max-w-[650px] flex-col overflow-hidden rounded-[32px] bg-white/80 px-6 py-8 shadow-[0_20px_60px_rgba(45,108,223,0.12)] backdrop-blur-xl sm:px-10">

            <!-- Progress indicators: Step 4 of onboarding -->
            <nav class="mb-8 flex items-center justify-center gap-3" aria-label="Onboarding progress">

                <span class="grid size-8 place-items-center rounded-full bg-[#2d6cdf] text-white" aria-label="Step 1 completed">
                    <i data-lucide="check" class="size-4"></i>
                </span>

                <span class="h-1 w-8 rounded-full bg-[#2d6cdf]"></span>

                <span class="grid size-8 place-items-center rounded-full bg-[#2d6cdf] text-white" aria-label="Step 2 completed">
                    <i data-lucide="check" class="size-4"></i>
                </span>

                <span class="h-1 w-8 rounded-full bg-[#2d6cdf]"></span>

                <span class="grid size-8 place-items-center rounded-full bg-[#2d6cdf] text-white" aria-label="Step 3 completed">
                    <i data-lucide="check" class="size-4"></i>
                </span>

                <span class="h-1 w-8 rounded-full bg-[#2d6cdf]"></span>

                <span class="grid size-8 place-items-center rounded-full bg-[#2d6cdf] text-white ring-4 ring-blue-100" aria-current="step">4</span>

                <span class="h-1 w-8 rounded-full bg-gray-200"></span>

                <span class="grid size-8 place-items-center rounded-full bg-gray-100 text-gray-400">5</span>
            </nav>

            <!-- Clima logo -->
            <div class="mb-6 flex items-center justify-center">
                <div class="flex items-center gap-4" aria-label="Clima logo">
                    <span class="grid size-[64px] shrink-0 place-items-center rounded-2xl bg-[#2d6cdf] text-white shadow-[0_8px_20px_rgba(45,108,223,0.25)]">
                        <i data-lucide="cloud" class="size-9"></i>
                    </span>

                    <span class="text-[38px] font-bold tracking-[-0.055em] text-[#202938]">
                        Clima
                    </span>
                </div>
            </div>

            <!-- Heading -->
            <header class="mb-7 text-center">
                <span class="mx-auto mb-3 grid size-12 place-items-center rounded-2xl bg-blue-50 text-[#2d6cdf]">
                    <i data-lucide="cloud-sun" class="size-6"></i>
                </span>

                <h1 class="text-2xl font-bold tracking-tight text-[#202938] sm:text-3xl">
                    Are you sensitive to certain conditions?
                </h1>

                <p class="mx-auto mt-3 max-w-md text-sm leading-6 text-gray-500 sm:text-base">
                    Select the weather or environmental conditions that may affect your comfort or daily activities.
                </p>
            </header>

            <!-- Weather sensitivity options -->
            <form id="weather-sensitivity-form" class="mx-auto flex w-full max-w-md flex-1 flex-col">

                <fieldset>
                    <legend class="mb-4 text-sm font-semibold text-[#202938]">
                        Select all that apply
                    </legend>

                    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">

                        <!-- Heat -->
                        <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 transition hover:border-[#2d6cdf] hover:bg-blue-50 has-[:checked]:border-[#2d6cdf] has-[:checked]:bg-blue-50">
                            <input type="checkbox" name="weather_sensitivities" value="heat"
                                class="size-4 shrink-0 accent-[#2d6cdf]">
                            <i data-lucide="sun" class="size-5 shrink-0 text-orange-500"></i>
                            <span class="text-sm font-medium text-[#202938]">Sensitive to Heat</span>
                        </label>

                        <!-- Cold -->
                        <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 transition hover:border-[#2d6cdf] hover:bg-blue-50 has-[:checked]:border-[#2d6cdf] has-[:checked]:bg-blue-50">
                            <input type="checkbox" name="weather_sensitivities" value="cold"
                                class="size-4 shrink-0 accent-[#2d6cdf]">
                            <i data-lucide="thermometer-snowflake" class="size-5 shrink-0 text-blue-500"></i>
                            <span class="text-sm font-medium text-[#202938]">Sensitive to Cold</span>
                        </label>

                        <!-- Rain -->
                        <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 transition hover:border-[#2d6cdf] hover:bg-blue-50 has-[:checked]:border-[#2d6cdf] has-[:checked]:bg-blue-50">
                            <input type="checkbox" name="weather_sensitivities" value="rain"
                                class="size-4 shrink-0 accent-[#2d6cdf]">
                            <i data-lucide="cloud-rain" class="size-5 shrink-0 text-blue-500"></i>
                            <span class="text-sm font-medium text-[#202938]">Sensitive to Rain</span>
                        </label>

                        <!-- Wind -->
                        <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 transition hover:border-[#2d6cdf] hover:bg-blue-50 has-[:checked]:border-[#2d6cdf] has-[:checked]:bg-blue-50">
                            <input type="checkbox" name="weather_sensitivities" value="wind"
                                class="size-4 shrink-0 accent-[#2d6cdf]">
                            <i data-lucide="wind" class="size-5 shrink-0 text-gray-500"></i>
                            <span class="text-sm font-medium text-[#202938]">Sensitive to Wind</span>
                        </label>

                        <!-- Snow -->
                        <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 transition hover:border-[#2d6cdf] hover:bg-blue-50 has-[:checked]:border-[#2d6cdf] has-[:checked]:bg-blue-50">
                            <input type="checkbox" name="weather_sensitivities" value="snow"
                                class="size-4 shrink-0 accent-[#2d6cdf]">
                            <i data-lucide="snowflake" class="size-5 shrink-0 text-blue-400"></i>
                            <span class="text-sm font-medium text-[#202938]">Sensitive to Snow</span>
                        </label>

                        <!-- Pollen -->
                        <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 transition hover:border-[#2d6cdf] hover:bg-blue-50 has-[:checked]:border-[#2d6cdf] has-[:checked]:bg-blue-50">
                            <input type="checkbox" name="weather_sensitivities" value="pollen"
                                class="size-4 shrink-0 accent-[#2d6cdf]">
                            <i data-lucide="flower-2" class="size-5 shrink-0 text-pink-500"></i>
                            <span class="text-sm font-medium text-[#202938]">Sensitive to Pollen</span>
                        </label>

                        <!-- Air quality -->
                        <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 transition hover:border-[#2d6cdf] hover:bg-blue-50 has-[:checked]:border-[#2d6cdf] has-[:checked]:bg-blue-50 sm:col-span-2">
                            <input type="checkbox" name="weather_sensitivities" value="air_quality"
                                class="size-4 shrink-0 accent-[#2d6cdf]">
                            <i data-lucide="wind" class="size-5 shrink-0 text-gray-500"></i>
                            <span class="text-sm font-medium text-[#202938]">Sensitive to Poor Air Quality</span>
                        </label>

                        <!-- None -->
                        <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-gray-200 bg-gray-50 p-4 transition hover:border-[#2d6cdf] hover:bg-blue-50 has-[:checked]:border-[#2d6cdf] has-[:checked]:bg-blue-50 sm:col-span-2">
                            <input type="checkbox" id="no-weather-sensitivity"
                                name="weather_sensitivities" value="none"
                                class="size-4 shrink-0 accent-[#2d6cdf]">
                            <i data-lucide="check-circle-2" class="size-5 shrink-0 text-gray-500"></i>
                            <span class="text-sm font-medium text-[#202938]">None of these</span>
                        </label>

                    </div>
                </fieldset>

                <p class="mb-6 mt-4 text-xs leading-5 text-gray-400">
                    This step is optional. You can change your selections later in your profile.
                </p>

                <p id="weather-sensitivity-status" class="mb-2 min-h-5 text-center text-sm text-rose-600"
                    role="status" aria-live="polite"></p>

                <!-- Navigation buttons -->
                <div class="mt-auto flex items-center justify-between gap-4 pt-4">

                    <a href="location.html"
                        class="inline-flex items-center justify-center gap-2 rounded-xl border border-gray-200 px-5 py-3 font-semibold text-gray-600 transition hover:bg-gray-50">
                        <i data-lucide="arrow-left" class="size-4"></i>
                        Back
                    </a>

                    <button type="submit"
                        class="inline-flex items-center justify-center gap-2 rounded-xl bg-[#2d6cdf] px-6 py-3 font-semibold text-white shadow-md shadow-blue-200 transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200">
                        Next
                        <i data-lucide="arrow-right" class="size-4"></i>
                    </button>

                </div>
            </form>
        </section>
    </main>
</body>

</html>
